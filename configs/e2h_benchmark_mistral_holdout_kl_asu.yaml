# SUPERSEDED BEFORE EXECUTION: DO NOT RUN.
# Section 43 first resolves the GPT/Llama operating range. This file is kept
# only as the immutable record of the unexecuted Section 42 design.
seed: 45
seeds: [45]
output_dir: results/e2h_benchmark_mistral_holdout_kl
stream_design: e2h_benchmark_gsm8k
datasets: [e2h_gsm8k]
allow_synthetic_datasets: false
replication_dataset: null
run_replication: false
items_per_dataset: 1319
difficulty_scheme: e2h_rating_quantiles
difficulty_partition: holdout
max_queries_per_scenario: null
queries_per_regime: 30
scenarios: [ST2]
window_sizes: [10]
guard: 3
run_ablation: false
run_strategy_comparison: false
resume: true

# 90 disjoint holdout questions x (K=5 + L=3) = 720 resumable calls.
k_repeats: 5
l_paraphrases: 3
use_rqeval: true
coherence_scorer: nli
stability_scorer: bertscore
publication_mode: true
# Complete and preserve the paid run, then apply the frozen external assessor.
fail_on_degenerate: false
detector_strategy: proposal_mapping

models:
  - backend: openai_compatible
    name: mistral_7b
    model: aws/mistral-7b
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

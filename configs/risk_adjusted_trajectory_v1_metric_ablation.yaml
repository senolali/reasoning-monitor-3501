  - [ES_raw]
  - [RS_raw, LS_raw]
  - [RS_raw, ES_raw]
  - [LS_raw, ES_raw]
  - [RS_raw, LS_raw, ES_raw]

analysis:
  implementation: src/reasoning_monitor/evaluation/risk_adjusted_trajectory_ablation.py
  estimator: discrete_time_hazard_logistic_ridge
  baseline_predictors: [trajectory_level, task_template, model]
  ridge_c_grid: [0.01, 0.1, 1.0, 10.0]
  outer_splits: 4
  inner_splits: 3
  grouping_unit: family_id
  seed: 20260926
  score: out_of_fold_log_loss_improvement

decision:
  minimum_combined_mean_improvement: 0.0
  minimum_combined_positive_folds: 3
  minimum_model_mean_improvement: 0.0
  selection_rule: >-
    Among qualifying candidates, select the subset with the fewest metrics;
    break ties by larger combined mean improvement and then lexical label.

decision_scope: >-
  A pass identifies one calibration-derived candidate for a separately
  versioned and prospectively validated RAT-v1.1 design. It does not relabel
  either failed RAT-v1 gate, authorize paid calls, open development or holdout,
  or support a scientific early-warning claim. If no subset qualifies, stop
  the RAT path rather than launching another paid campaign.

output_path: results/risk_adjusted_trajectory_v1_calibration/data/rat_v1_calibration_metric_ablation.json

# HOLD FOR EXPLICIT EXECUTION: independent RAT-v1 calibration split only.
# Structural preflight authorises preparation, not paid model calls.
seed: 20260926
seeds: [20260926]
output_dir: results/risk_adjusted_trajectory_v1_calibration
stream_design: controlled_trajectory
datasets: []
allow_synthetic_datasets: false
controlled_trajectory_bank: configs/selections/risk_adjusted_trajectory_v1_items.json
controlled_trajectory_split: calibration
replication_dataset: null
run_replication: false
scenarios: [RAT]
max_queries_per_scenario: null
queries_per_regime: null
window_sizes: [6]
guard: 2
run_ablation: false
run_strategy_comparison: false
resume: true

# 144 items/model x (K=1 + L=3) x 3 models = 1,728 resumable calls.
k_repeats: 1
l_paraphrases: 3
semantic_answer_policy: configs/semantic_answer_policy_v1.yaml
use_rqeval: true
coherence_scorer: nli
stability_scorer: bertscore
publication_mode: true
fail_on_degenerate: false
detector_strategy: proposal_mapping

models:
  - backend: openai_compatible
    name: gpt4o_mini
    model: openai/gpt4o_mini
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 768
    system_prompt: >-
      Follow the user's bounded numbered-reasoning and final-answer contract
      exactly. Return a best integer answer even when uncertain.
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0
  - backend: openai_compatible
    name: llama4_scout
    model: aws/llama4_scout-17b
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 768
    system_prompt: >-
      Follow the user's bounded numbered-reasoning and final-answer contract
      exactly. Return a best integer answer even when uncertain.
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0
  - backend: openai_compatible
    name: mistral_7b
    model: aws/mistral-7b
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 768
    system_prompt: >-
      Follow the user's bounded numbered-reasoning and final-answer contract
      exactly. Return a best integer answer even when uncertain.
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

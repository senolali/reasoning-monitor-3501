# HOLD FOR EXPLICIT EXECUTION: GPT/Llama E2H-GSM8K range calibration.
# The protocol is frozen in DEVIATIONS_FROM_PROPOSAL.md Section 43.
seed: 46
seeds: [46]
output_dir: results/e2h_extreme_calibration_gpt_llama
stream_design: e2h_benchmark_gsm8k
datasets: [e2h_gsm8k]
allow_synthetic_datasets: false
replication_dataset: null
run_replication: false
items_per_dataset: 1319
difficulty_scheme: e2h_extreme_quantiles
difficulty_partition: range_calibration
max_queries_per_scenario: null
queries_per_regime: 30
scenarios: [ST3, ST4, ST5]
window_sizes: [5]
guard: 2
run_ablation: false
run_strategy_comparison: false
resume: true

# 30 questions x 3 extreme bands x 2 models = 180 primary calls.
k_repeats: 1
l_paraphrases: 0
use_rqeval: true
coherence_scorer: lexical
stability_scorer: jaccard
publication_mode: false
fail_on_degenerate: false
detector_strategy: proposal_mapping

models:
  - backend: openai_compatible
    name: gpt4o_mini
    model: openai/gpt4o_mini
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0
  - backend: openai_compatible
    name: llama3_8b
    model: aws/llama3-8b
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

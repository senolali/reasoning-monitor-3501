# HOLD FOR EXPLICIT EXECUTION: Llama-only E2H method-development pilot.
# The protocol is frozen in DEVIATIONS_FROM_PROPOSAL.md Section 40.
seed: 43
seeds: [43]
output_dir: results/e2h_stepband_llama_kl_pilot
stream_design: e2h_gsm8k
datasets: [gsm8k]
replication_dataset: null
run_replication: false
items_per_dataset: 300
difficulty_scheme: solution_steps
max_queries_per_scenario: null
queries_per_regime: 30
scenarios: [ST2]
window_sizes: [10]
guard: 3
run_ablation: false
run_strategy_comparison: false
resume: true

# 90 queries x (K=5 + L=3) x one model = 720 resumable calls.
k_repeats: 5
l_paraphrases: 3
use_rqeval: true
coherence_scorer: nli
stability_scorer: bertscore
publication_mode: true
# Complete the cell, then apply the frozen post-run health gate.
fail_on_degenerate: false

# Preserve the detector mapping stated in the accepted proposal. Alarm times
# are exploratory until the call-free Section 40 calibration is completed.
detector_strategy: proposal_mapping

models:
  - backend: openai_compatible
    name: llama3_8b
    model: aws/llama3-8b
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

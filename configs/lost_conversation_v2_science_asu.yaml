    - >-
      Using only the information currently revealed, write concise numbered
      reasoning. Finish with exactly FINAL_ANSWER: <number> if determined;
      otherwise finish with STATUS: NEED_MORE_INFORMATION.
    - >-
      Reason in short numbered steps without assuming unrevealed facts. Your last
      line must be FINAL_ANSWER: <number> when solvable now, or STATUS:
      NEED_MORE_INFORMATION when more facts are required.

protocol_id: CDR-v1.3
stage: nine_dialogue_primary_validation_analysis
expected_models: [gpt4o_mini, llama4_scout]
expected_dialogues:
  - cdr-v1-budget-002
  - cdr-v1-budget-003
  - cdr-v1-budget-004
  - cdr-v1-incident-002
  - cdr-v1-incident-003
  - cdr-v1-incident-004
  - cdr-v1-cohort-002
  - cdr-v1-cohort-003
  - cdr-v1-cohort-004
expected_conditions: [user_only_history, state_summary]
expected_turns_per_dialogue: 12
expected_records_per_model: 216
expected_post_baseline_pairs_per_model: 99
max_output_tokens: 1024

minimum_success_rate: 1.0
minimum_strict_final_marker_rate: 0.99
minimum_stored_answer_agreement_rate: 0.99
maximum_truncations: 0
maximum_token_ceiling_hits: 0

# Dialogue clusters are the independent units; turn-level p-values are not primary.
minimum_state_summary_accuracy: 0.95
minimum_mean_dialogue_history_load_gap: 0.10
maximum_one_sided_sign_flip_p: 0.05
minimum_positive_dialogue_gaps: 7
minimum_models_meeting_primary_gate: 2

# Early=turns 2-6, late=turns 7-12. Interaction=(late gap)-(early gap).
early_turn_start: 2
early_turn_end: 6
late_turn_start: 7
late_turn_end: 12
minimum_mean_longitudinal_interaction: 0.05
maximum_longitudinal_sign_flip_p: 0.05
minimum_positive_dialogue_interactions: 6
minimum_models_meeting_longitudinal_gate: 1
require_nonnegative_interaction_all_models: true

pass_authorizes: >-
  Call-free metric-trajectory analysis and preparation of an early-warning
  calibration plan on these calibration records. It does not authorize the
  conditional self-history arm, further paid calls, development or holdout
  access, or a scientific claim.


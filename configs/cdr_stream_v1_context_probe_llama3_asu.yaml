protocol_id: CDR-Stream-v1-context-probe-llama3
# Measures, rather than assumes, whether the ASU Llama-3 models can hold the
# CDR-Stream packed history. The Llama pilot prompts (hash-verified, rebuilt from
# the recorded pilot primaries) are sent at turns 10, 25, 40, 60, 80, 100. At each
# length a "real" call uses the pilot prompt, and a "needle" call asks the model to
# quote the oldest user message (detects silent truncation). 12 calls per model.
# Technical only; accuracy is not reported. A model is feasible only if both the
# turn-100 real call succeeds and the turn-100 needle is recalled. Feasibility
# permits only a production probe and the identical 90-call K-diversity probe.
execution_authorized: false

# Exploratory CQ-only calibration of the preregistered GSM8K solution-step bands.
# Its only decision variable is CQ: auxiliary columns may be emitted by the
# framework but are not interpreted. Passing requires Easy > Medium > Hard
# with both CQ gaps >= 0.10.
seed: 42
seeds: [42]
output_dir: results/step_band_calibration_llama
datasets: [gsm8k]
replication_dataset: null
run_replication: false
items_per_dataset: 300
difficulty_scheme: solution_steps
max_queries_per_scenario: null
queries_per_regime: 30
scenarios: [ST3, ST4, ST5]
window_sizes: [5]
guard: 2
run_ablation: false
run_strategy_comparison: false
resume: true

# One baseline call per item is sufficient for the CQ tier gate.
k_repeats: 1
l_paraphrases: 0
use_rqeval: true
coherence_scorer: lexical
stability_scorer: jaccard
publication_mode: false
fail_on_degenerate: false

models:
  - backend: openai_compatible
    name: llama3_8b
    model: aws/llama3-8b
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

# HOLD FOR EXPLICIT EXECUTION: Section 47 GPT-4o-mini AMC holdout K/L run.
seed: 48
seeds: [48]
output_dir: results/e2h_final_holdout_gpt4o_mini
stream_design: e2h_benchmark_amc
datasets: [e2h_amc]
allow_synthetic_datasets: false
replication_dataset: null
run_replication: false
items_per_dataset: 2975
difficulty_scheme: e2h_rating_quantiles
difficulty_partition: holdout
max_queries_per_scenario: null
queries_per_regime: 30
scenarios: [ST2]
window_sizes: [10]
guard: 3
run_ablation: false
run_strategy_comparison: false
resume: true

# 90 untouched questions x (K=5 + L=3) = 720 resumable calls.
k_repeats: 5
l_paraphrases: 3
use_rqeval: true
coherence_scorer: nli
stability_scorer: bertscore
publication_mode: true
fail_on_degenerate: false
detector_strategy: proposal_mapping

models:
  - backend: openai_compatible
    name: gpt4o_mini
    model: openai/gpt4o_mini
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 2048
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

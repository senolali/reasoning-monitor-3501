# Cross-model CQ-only validation of the frozen GSM8K solution-step bands.
# The Llama calibration has already passed. This run tests the two remaining
# proposal models without changing the bands or the >=0.10 adjacent-gap gate.
seed: 42
seeds: [42]
output_dir: results/step_band_calibration_gpt_mistral
datasets: [gsm8k]
replication_dataset: null
run_replication: false
items_per_dataset: 300
difficulty_scheme: solution_steps
max_queries_per_scenario: null
queries_per_regime: 30
scenarios: [ST3, ST4, ST5]
window_sizes: [5]
guard: 2
run_ablation: false
run_strategy_comparison: false
resume: true

# CQ is the only decision variable. Auxiliary columns may be emitted but are
# not interpreted in this calibration.
k_repeats: 1
l_paraphrases: 0
use_rqeval: true
coherence_scorer: lexical
stability_scorer: jaccard
publication_mode: false
fail_on_degenerate: false

models:
  - backend: openai_compatible
    name: gpt4o_mini
    model: openai/gpt4o_mini
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0
  - backend: openai_compatible
    name: mistral_7b
    model: aws/mistral-7b
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

# Frontier-model exploratory pilot completed on 2026-09-18. This is not the
# proposal's main factorial model set and must not be used to accept/reject the
# main GSM8K design. Retained unchanged for provenance of the saved results.
seed: 42
seeds: [42]
output_dir: results/methodology_pilot
datasets: [gsm8k]
replication_dataset: null
run_replication: false
items_per_dataset: 120
max_queries_per_scenario: null
queries_per_regime: 12
scenarios: [ST2, ST3, ST4, ST5]
window_sizes: [5]
guard: 2
run_ablation: false
run_strategy_comparison: false
resume: true

k_repeats: 5
l_paraphrases: 3
use_rqeval: true
coherence_scorer: nli
stability_scorer: bertscore
publication_mode: true
fail_on_degenerate: false

models:
  - backend: openai_compatible
    name: gpt5_5
    model: openai/gpt5_5
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0
  - backend: openai_compatible
    name: claude5_sonnet
    model: aws/claude5_sonnet
    base_url: https://api-main.aiml.asu.edu/v1
    api_key_env: ASU_API_KEY
    temperature: 0.7
    max_tokens: 512
    request_options:
      enable_history: false
      enable_search: false
      enhance_prompt: {time: false, date: false}
    max_retries: 4
    backoff_base: 1.0

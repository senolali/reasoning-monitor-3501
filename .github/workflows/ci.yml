name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v
      - run: ruff check src/ tests/
      # Smoke-test the whole pipeline offline: the synthetic corpus makes this
      # deterministic and independent of the HuggingFace Hub.
      - run: reasoning-monitor --quick --output-dir /tmp/ci
      - run: test -f /tmp/ci/manifest.json
